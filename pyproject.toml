[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmif-inspector"
version = "0.1.0"
description = "MMIF Inspector"
readme = "src/inspector/README.md"
requires-python = ">=3.10"
dependencies = ["jinja2==3.1.*"]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest==9.*"]

[project.scripts]
inspect = "inspector:main"

[project.urls]
homepage = "https://clams.ai"
source = "https://github.com/clamsproject/mmif-inspector"

[tool.setuptools.packages.find]
where = ["./src"]

[tool.setuptools.package-data]
inspector = ["*.js", "*.css", "templates/*.html"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
